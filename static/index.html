<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Form Processor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <!-- Dashboard -->
        <section id="dashboard-section" class="section">
            <div class="dashboard-header">
                <h2>Election Form Processor</h2>
                <button id="new-session-btn">+ New Session</button>
            </div>
            <div id="sessions-list"></div>
        </section>

        <!-- Step 1: Upload PDF -->
        <section id="upload-section" class="section hidden">
            <button class="back-btn" id="upload-back-btn">&larr; Dashboard</button>
            <h2>1. Upload PDF</h2>
            <input type="file" id="pdf-input" accept=".pdf">
            <button id="upload-btn">Upload</button>
            <p id="upload-status"></p>
        </section>

        <!-- Step 2: Define Candidates -->
        <section id="schema-section" class="section hidden">
            <button class="back-btn" id="schema-back-btn">&larr; Dashboard</button>
            <h2>2. Enter Candidates</h2>
            <div class="candidate-inputs">
                <div class="candidate-row">
                    <label>Candidate 1:</label>
                    <input type="text" id="candidate1-name" placeholder="Name (e.g., Farooq Sattar)">
                    <label>Row:</label>
                    <input type="number" id="candidate1-row" placeholder="Row #" min="1">
                </div>
                <div class="candidate-row">
                    <label>Candidate 2:</label>
                    <input type="text" id="candidate2-name" placeholder="Name (e.g., Aftab Jehangir)">
                    <label>Row:</label>
                    <input type="number" id="candidate2-row" placeholder="Row #" min="1">
                </div>
            </div>
            <button id="save-schema-btn">Continue</button>
        </section>

        <!-- Step 3: Main Processing View -->
        <section id="process-section" class="section hidden">
            <button class="back-btn" id="process-back-btn">&larr; Dashboard</button>
            <div class="process-header">
                <h2>3. Process Forms</h2>
                <div id="progress-info">
                    <span id="progress-text">0 / 0 pages processed</span>
                    <progress id="progress-bar" value="0" max="100"></progress>
                </div>
            </div>

            <!-- Polling Station Queues -->
            <div id="queue-section">
                <div id="pending-queue" class="queue-panel">
                    <div class="queue-header">
                        <h3>Pending Queue</h3>
                        <button id="batch-process-btn" disabled>Process All</button>
                    </div>
                    <div id="pending-list" class="queue-list"></div>
                </div>

                <div id="done-queue" class="queue-panel">
                    <div class="queue-header">
                        <h3>Done (Awaiting Verification)</h3>
                        <button id="bulk-approve-btn" disabled>Approve All</button>
                    </div>
                    <div id="done-list" class="queue-list"></div>
                </div>

                <div id="approved-queue" class="queue-panel">
                    <div class="queue-header">
                        <h3>Approved</h3>
                        <button id="export-csv-btn" disabled>Export CSV</button>
                    </div>
                    <div id="approved-list" class="queue-list"></div>
                </div>
            </div>

            <!-- Page Selector -->
            <div id="page-selector">
                <h3>Select Pages</h3>
                <p>Selected: <span id="selected-pages-text">None</span></p>
                <button id="create-station-btn" disabled>Create Polling Station</button>
                <div id="auto-create-section">
                    <label for="pages-per-station">Pages per station:</label>
                    <input type="number" id="pages-per-station" min="1" max="10" value="1">
                    <button id="auto-create-btn">Automatically Create All Polling Stations</button>
                </div>
                <div id="page-thumbnails"></div>
            </div>

            <!-- Split View: PDF | Form -->
            <div id="split-view" class="hidden">
                <div class="split-view-nav">
                    <button class="back-btn" id="split-view-back-btn">&larr; Back to Queue</button>
                    <div class="station-nav">
                        <button id="prev-station-btn" disabled>&larr; Prev</button>
                        <span id="station-nav-info"></span>
                        <button id="next-station-btn" disabled>Next &rarr;</button>
                    </div>
                </div>
                <div id="split-view-container">
                <div id="pdf-viewer">
                    <h3 id="split-view-title">Selected Pages</h3>
                    <div id="pdf-images"></div>
                </div>
                <div id="form-editor">
                    <h3>Extracted Data</h3>
                    <div id="form-fields"></div>
                    <div class="form-actions">
                        <button id="approve-btn">Approve & Save</button>
                    </div>
                </div>
                </div>
            </div>
        </section>

        <!-- Completion -->
        <section id="complete-section" class="section hidden">
            <button class="back-btn" id="complete-back-btn">&larr; Dashboard</button>
            <h2>Processing Complete!</h2>
            <p>All pages have been processed.</p>
            <button id="view-results-btn">View Results</button>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
